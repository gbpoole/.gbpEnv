# use a colon and a number (e.g. ':1') to indicate the depth to search.
#   depth == 0, just use the given path; optional session name can be added after a second ':'
#   depth <  0, include all paths to given depth
#   depth >  0, only include roots of git repos to given depth
#   You can add a '!' before an entry to indicate that it's a path/list-of-paths to exclude
TS_SEARCH_PATHS=(~/my_code/:1 ~/.gbpEnv:0:gbpEnv ~/3rd_Party:0 ~/Projects:-1 !~/Projects/:0 ~/Projects/ADACS/MAP:2 ~/Library/Mobile\ Documents/iCloud~md~obsidian/Documents/Main:0:Obsidian )
TS_EXTRA_SEARCH_PATHS=( )
TS_MAX_DEPTH=0
TS_LOG=file
TS_LOG_FILE=/tmp/tmux-sessionizer/log.txt
